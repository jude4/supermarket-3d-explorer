services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: supermarket
      POSTGRES_DB: supermarket
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a PostgreSQL password}
    volumes:
      - store-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U supermarket -d supermarket]
      interval: 5s
      timeout: 3s
      retries: 15
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set the URL for the db service with the matching password}
      NODE_ENV: production
      PORT: 3001
      ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?Set the public HTTPS application origin}
volumes:
  store-data:
